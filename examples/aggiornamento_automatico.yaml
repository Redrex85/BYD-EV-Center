# Auto-update BYD EV Center
# Importa in HA: Impostazioni -> Automazioni -> ⋮ -> "Crea nuova" -> modalità YAML
# oppure incollalo sotto "automation:" nel tuo automation.yaml.
# Requisito: webhook_id deve combaciare con l'URL del secret HA_WEBHOOK_URL nel workflow GitHub.
#   HA_WEBHOOK_URL = http://192.168.1.70/api/webhook/byd_ev_center_release
automation:
  - alias: "BYD EV Center — auto update"
    id: byd_ev_center_auto_update
    mode: single
    trigger:
      - platform: webhook
        webhook_id: byd_ev_center_release
    action:
      - service: homeassistant.update_entity
        target:
          entity_id: update.byd_ev_center_update
      - delay: "00:00:15"
      - service: update.install
        target:
          entity_id: update.byd_ev_center_update